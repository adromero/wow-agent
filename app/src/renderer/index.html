<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' file:">
  <title>WoW Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header with game state summary -->
    <div id="header">
      <div id="header-top">
        <div id="header-title">WoW Agent</div>
        <button id="settings-button" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
      <div id="header-status">
        <span id="status-indicator" class="disconnected"></span>
        <span id="status-text">Waiting for sync...</span>
        <span id="version-label"></span>
      </div>
      <div id="game-context-bar">
        <span id="ctx-player"></span>
        <span id="ctx-zone"></span>
        <span id="ctx-target"></span>
      </div>
    </div>

    <!-- Settings modal -->
    <div id="settings-overlay" class="hidden">
      <div id="settings-modal">
        <div id="settings-header">
          <span>Settings</span>
          <button id="settings-close" title="Close">&times;</button>
        </div>
        <div id="settings-body">
          <label for="version-select">WoW Version</label>
          <select id="version-select"></select>
        </div>
      </div>
    </div>

    <!-- Chat messages -->
    <div id="messages">
      <div class="message system">
        <div class="message-content">
          Welcome to WoW Agent! Run <code>/agent sync</code> in-game to share your game state, then ask me anything about WoW.
        </div>
      </div>
    </div>

    <!-- Thinking/tool indicator -->
    <div id="thinking-indicator" class="hidden">
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
      <span id="thinking-text">Thinking...</span>
    </div>

    <!-- Screenshot preview -->
    <div id="screenshot-preview" class="hidden">
      <img id="screenshot-img" />
      <button id="screenshot-dismiss" title="Remove screenshot">&times;</button>
    </div>

    <!-- Input area -->
    <div id="input-area">
      <textarea id="message-input" placeholder="Ask about boss strategies, class tips, gear..." rows="1"></textarea>
      <button id="send-button" title="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
